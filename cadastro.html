<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro de Transporte</title>
</head>

<body>

<h2>Cadastro de Transporte de Paciente</h2>

<form>

<label>Nome do Paciente</label><br>
<input type="text"><br><br>

<label>Idade</label><br>
<input type="number"><br><br>

<label>Tipo de Transporte</label><br>
<select>
<option>Maca</option>
<option>Cadeira de Rodas</option>
<option>Leito</option>
</select><br><br>

<label>Paciente Acamado</label><br>
<select>
<option>Sim</option>
<option>Não</option>
</select><br><br>

<label>Doença Infectológica</label><br>
<select>
<option>Não</option>
<option>Sim</option>
</select><br><br>

<label>Local Atual</label><br>
<input type="text"><br><br>

<label>Destino</label><br>
<input type="text"><br><br>

<label>Tempo limite transporte (min)</label><br>
<input type="number"><br><br>

<button>Registrar</button>

</form>

</body>
</html>
